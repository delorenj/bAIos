tasks:
  # Phase 3: Development Foundation
  - id: mise_install
    description: Install Mise Version Manager
    dependencies:
      - curl_install
    check_command: mise --version
    install_command: curl https://mise.run | sh
  - id: mise_zsh_integration
    description: Integrate Mise with Zsh
    dependencies:
      - mise_install
      - oh_my_zsh
    check_command: grep -q 'mise activate' ~/.zshrc
    install_command: 'echo ''eval "$(mise activate zsh)"'' >> ~/.zshrc'
  - id: git_install
    description: Install Git
    dependencies:
      - apt_update
    check_command: git --version
    install_command: sudo apt install git -y
  - id: ssh_key_generate
    description: Generate SSH Key for GitHub authentication
    dependencies:
      - git_install
    check_command: test -f ~/.ssh/id_ed25519
    install_command: ssh-keygen -t ed25519 -C 'user@example.com'
  - id: github_cli
    description: Install GitHub CLI
    dependencies:
      - curl_install
    check_command: gh --version
    install_command: curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && echo 'deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install gh -y
  - id: github_auth
    description: GitHub Authentication
    dependencies:
      - github_cli
      - ssh_key_generate
    check_command: gh auth status
    install_command: gh auth login

  # Phase 4: Core Development Tools
  - id: python_install
    description: Install Python 3.12.9
    dependencies:
      - mise_zsh_integration
    check_command: mise ls python | grep 3.12.9
    install_command: mise install python@3.12.9 && mise global python@3.12.9
  - id: nodejs_install
    description: Install Node.js Latest
    dependencies:
      - mise_zsh_integration
    check_command: mise ls nodejs | grep latest
    install_command: mise install nodejs@latest && mise global nodejs@latest
  - id: uv_install
    description: Install UV Package Manager
    dependencies:
      - python_install
    check_command: mise ls uv | grep latest
    install_command: mise install uv@latest && mise global uv@latest
  - id: pipx_install
    description: Install Pipx
    dependencies:
      - python_install
    check_command: mise ls pipx | grep latest
    install_command: mise install pipx@latest && mise global pipx@latest
  - id: neovim_install
    description: Install Neovim >= 0.11.0
    dependencies:
      - curl_install
    check_command: nvim --version | head -1 | grep -E 'v0\.1[1-9]|v[1-9]'
    install_command: curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux64.tar.gz && sudo tar -C /opt -xzf nvim-linux64.tar.gz && sudo ln -sf /opt/nvim-linux64/bin/nvim /usr/local/bin/nvim
  - id: lazyvim_config
    description: Configure LazyVim
    dependencies:
      - neovim_install
      - git_install
    check_command: test -d ~/.config/nvim
    install_command: git clone https://github.com/LazyVim/starter ~/.config/nvim && rm -rf ~/.config/nvim/.git
