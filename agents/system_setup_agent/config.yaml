tasks:
  # Phase 1: Foundation
  - id: wsl_setup
    description: Install and configure Windows Subsystem for Linux
  - id: ubuntu_setup
    description: Install Ubuntu distribution in WSL
    dependencies:
      - wsl_setup
  - id: apt_update
    description: Update apt package manager and upgrade system
    dependencies:
      - ubuntu_setup
    check_command: apt list --upgradable
    install_command: sudo apt update && sudo apt upgrade -y
